name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Compile binary
      run: make
    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: pong
        path: ./pong
